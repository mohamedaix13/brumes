name: Build APK Android

on:
  push:
    branches: [main]
    paths:
      - 'AndroidBrumes/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configurer le cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('AndroidBrumes/**/*.kts') }}
          restore-keys: gradle-

      - name: Compiler l'APK debug
        working-directory: AndroidBrumes
        run: gradle assembleDebug --no-daemon

      - name: Renommer l'APK
        run: mv AndroidBrumes/app/build/outputs/apk/debug/app-debug.apk Brumes.apk

      - name: Téléverser l'APK en artifact
        uses: actions/upload-artifact@v4
        with:
          name: Brumes-APK
          path: Brumes.apk
          retention-days: 30
