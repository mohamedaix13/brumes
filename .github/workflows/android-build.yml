name: Build APK Android

on:
  push:
    branches: [main]
    paths:
      - 'AndroidBrumes/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Installer le SDK Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Compiler l'APK
        run: |
          curl --fail --silent --show-error --location https://services.gradle.org/distributions/gradle-8.10.2-bin.zip --output /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.10.2/bin/gradle -p AndroidBrumes :app:assembleDebug --no-daemon

      - name: Téléverser les logs en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-erreur-build
          path: |
            AndroidBrumes/app/build/reports/**
            AndroidBrumes/build/**
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v4
        name: Téléverser l'APK
        with:
          name: Brumes-APK
          path: AndroidBrumes/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
