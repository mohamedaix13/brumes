name: Build APK Android

on:
  push:
    branches: [main]
    paths:
      - 'AndroidBrumes/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: SDK Android
        run: |
          set -x
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" 2>/dev/null || true
          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ -z "$SDKM" ]; then
            SDKM="$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -n1 || true)"
          fi
          echo "SDKM=$SDKM"
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses >/dev/null 2>&1 || true
            "$SDKM" --install "platforms;android-35" "build-tools;35.0.0" >/dev/null 2>&1 || true
          else
            echo "sdkmanager introuvable : SDK préinstallé utilisé tel quel"
          fi
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || true

      - name: Compiler l'APK
        run: |
          curl --fail --silent --show-error --location https://services.gradle.org/distributions/gradle-8.10.2-bin.zip --output /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.10.2/bin/gradle -p AndroidBrumes :app:assembleDebug --no-daemon --stacktrace

      - name: Téléverser les logs en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-erreur-build
          path: |
            AndroidBrumes/app/build/reports/**
            AndroidBrumes/app/build/outputs/logs/**
            AndroidBrumes/build/**
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v4
        name: Téléverser l'APK
        with:
          name: Brumes-APK
          path: AndroidBrumes/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
