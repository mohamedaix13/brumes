name: Brumes 0.7 textured build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-v07-rich.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Inject Brumes 0.7 game and richer maps
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p AndroidBrumes/app/src/main/java/com/mumu/brumes
          cat .github/v07_payload/source.*.b64 | tr -d '\n' | base64 -d | gzip -dc > AndroidBrumes/app/src/main/java/com/mumu/brumes/GameActivityV07.kt
          cat .github/v07_payload/aether.*.b64 | tr -d '\n' | base64 -d | gzip -dc > AndroidBrumes/app/src/main/assets/world_aether.json
          cat .github/v07_payload/forest.*.b64 | tr -d '\n' | base64 -d | gzip -dc > AndroidBrumes/app/src/main/assets/world_forest.json
          python3 - <<'PY'
          from pathlib import Path
          manifest=Path('AndroidBrumes/app/src/main/AndroidManifest.xml')
          m=manifest.read_text()
          m=m.replace('android:label="Brumes 0.6"','android:label="Brumes 0.7"')
          m=m.replace('android:name="com.mumu.brumes.GameActivityV06"','android:name="com.mumu.brumes.GameActivityV07"')
          manifest.write_text(m)
          gradle=Path('AndroidBrumes/app/build.gradle.kts')
          g=gradle.read_text()
          g=g.replace('versionCode = 8','versionCode = 9')
          g=g.replace('versionName = "0.6.0"','versionName = "0.7.0"')
          g=g.replace('applicationIdSuffix = ".s25v060"','applicationIdSuffix = ".s25v070"')
          gradle.write_text(g)
          print('V07 source bytes:', Path('AndroidBrumes/app/src/main/java/com/mumu/brumes/GameActivityV07.kt').stat().st_size)
          print('Aether JSON bytes:', Path('AndroidBrumes/app/src/main/assets/world_aether.json').stat().st_size)
          print('Forest JSON bytes:', Path('AndroidBrumes/app/src/main/assets/world_forest.json').stat().st_size)
          PY

      - name: Compile APK
        run: |
          curl --fail --silent --show-error --location https://services.gradle.org/distributions/gradle-8.10.2-bin.zip --output /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.10.2/bin/gradle -p AndroidBrumes :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Brumes-0.7-S25-textured
          path: AndroidBrumes/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
