name: Compile un projet NexaDev (APK a la demande)

on:
  push:
    branches: [ main ]
    paths: [ "built-apps/**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Build all generated apps
        run: |
          curl -sL -o /tmp/g.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/g.zip -d /tmp
          for d in built-apps/*/ ; do
            echo "Building $d"
            (cd "$d" && /tmp/gradle-8.7/bin/gradle assembleDebug --no-daemon) || echo "FAILED $d"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: BuiltApps-APK
          path: built-apps/*/app/build/outputs/apk/debug/app-debug.apk