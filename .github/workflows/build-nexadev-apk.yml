name: Build NexaDev APK (Codex engine + Mistral)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout host repo
        uses: actions/checkout@v4

      - name: Checkout the real OpenAI Codex source (Apache-2.0)
        uses: actions/checkout@v4
        with:
          repository: openai/codex
          path: upstream-codex

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - name: Install Android SDK manually
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          curl -sL -o tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q tools.zip
          mv cmdline-tools latest
          rm tools.zip
          yes | latest/bin/sdkmanager --licenses > /dev/null
          latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Set up Rust with aarch64-linux-android target
        uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }

      - name: Install NDK and set linker env
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973" > /dev/null
          TOOLCHAIN="$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android34-clang" >> $GITHUB_ENV
          echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android34-clang" >> $GITHUB_ENV

      - name: Build the real Codex CLI for Android ARM64
        run: |
          cd upstream-codex/codex-rs
          (cargo build --release --target aarch64-linux-android -p codex-cli 2>&1 || cargo build --release --target aarch64-linux-android -p codex 2>&1) | tee /tmp/rust-build.log

      - name: Report failure in an issue (autonomous loop)
        if: failure()
        run: |
          if [ -f /tmp/rust-build.log ]; then
            ERR=$(tail -n 100 /tmp/rust-build.log)
          else
            ERR="failure before rust build (see logs)"
          fi
          gh issue create --title "CI build failure ${{ github.run_id }}" --body "Auto-reported error:

          ${ERR}" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Embed Codex binary into the app
        run: |
          mkdir -p nexadev/app/src/main/jniLibs/arm64-v8a
          cp upstream-codex/codex-rs/target/aarch64-linux-android/release/codex nexadev/app/src/main/jniLibs/arm64-v8a/libcodex.so

      - name: Build APK with Gradle
        run: |
          curl -sL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          cd nexadev
          /tmp/gradle-8.7/bin/gradle assembleDebug --no-daemon 2>&1 | tee /tmp/gradle.log

      - name: Report gradle failure in an issue
        if: failure()
        run: |
          gh issue create --title "CI gradle failure ${{ github.run_id }}" --body "$(tail -n 100 /tmp/gradle.log)" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with: { name: NexaDev-APK, path: nexadev/app/build/outputs/apk/debug/app-debug.apk }

      - name: Release APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: nexadev-${{ github.run_number }}
          files: nexadev/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}