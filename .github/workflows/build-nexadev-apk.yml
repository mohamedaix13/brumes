name: Build NexaDev APK (Codex engine + Mistral)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout host repo
        uses: actions/checkout@v4

      - name: Checkout the real OpenAI Codex source (Apache-2.0)
        uses: actions/checkout@v4
        with:
          repository: openai/codex
          path: upstream-codex

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Rust with aarch64-linux-android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install NDK and set linker env
        run: |
          yes | sdkmanager "ndk;27.0.12077973" > /dev/null
          TOOLCHAIN="$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android34-clang" >> $GITHUB_ENV
          echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android34-clang" >> $GITHUB_ENV

      - name: Build the real Codex CLI for Android ARM64
        run: |
          cd upstream-codex/codex-rs
          cargo build --release --target aarch64-linux-android -p codex-cli || \
            cargo build --release --target aarch64-linux-android -p codex

      - name: Embed Codex binary into the app (libcodex.so convention)
        run: |
          mkdir -p nexadev/app/src/main/jniLibs/arm64-v8a
          cp upstream-codex/codex-rs/target/aarch64-linux-android/release/codex \
             nexadev/app/src/main/jniLibs/arm64-v8a/libcodex.so

      - name: Build APK with Gradle
        run: |
          curl -sL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          cd nexadev
          /tmp/gradle-8.7/bin/gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexaDev-APK
          path: nexadev/app/build/outputs/apk/debug/app-debug.apk

      - name: Release APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: nexadev-${{ github.run_number }}
          files: nexadev/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
