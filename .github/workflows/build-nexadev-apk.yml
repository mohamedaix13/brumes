name: Build NexaDev APK (Codex engine + Mistral)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout host repo
        uses: actions/checkout@v4

      - name: Checkout the real OpenAI Codex source (Apache-2.0)
        uses: actions/checkout@v4
        with:
          repository: openai/codex
          path: upstream-codex

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK manually (cmdline-tools + platform 34)
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          curl -sL -o tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q tools.zip
          mv cmdline-tools latest
          rm tools.zip
          yes | latest/bin/sdkmanager --licenses > /dev/null
          latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Set up Rust with aarch64-linux-android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install NDK and set linker env
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973" > /dev/null
          TOOLCHAIN="$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android34-clang" >> $GITHUB_ENV
          echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android34-clang" >> $GITHUB_ENV

      - name: Build the real Codex CLI for Android ARM64 (non bloquant)
        id: rust
        continue-on-error: true
        run: |
          cd upstream-codex/codex-rs
          # détecte le vrai nom du paquet CLI
          PKG=$(cargo metadata --format-version 1 --no-deps 2>/dev/null | python3 -c "
          import json,sys
          m=json.load(sys.stdin)
          names=[p['name'] for p in m['packages']]
          for c in ['codex-cli','codex','cli']:
              if c in names:
                  print(c); break
          else:
              print('codex')
          ")
          echo "Building package: $PKG"
          cargo build --release --target aarch64-linux-android -p "$PKG" 2>&1 | tee /tmp/rust-build.log
          BIN="target/aarch64-linux-android/release/$PKG"
          [ -f "$BIN" ] || BIN="target/aarch64-linux-android/release/codex"
          if [ -f "$BIN" ]; then
            echo "binary=$BIN" >> $GITHUB_OUTPUT
            mkdir -p $GITHUB_WORKSPACE/nexadev/app/src/main/jniLibs/arm64-v8a
            cp "$BIN" $GITHUB_WORKSPACE/nexadev/app/src/main/jniLibs/arm64-v8a/libcodex.so
            echo "ENGINE=ok" >> $GITHUB_ENV
          else
            echo "ENGINE=absent" >> $GITHUB_ENV
          fi

      - name: Diagnostics Rust (résumé public du build)
        if: steps.rust.outcome == 'failure'
        run: |
          echo "## Erreurs de compilation Rust (moteur Codex)" >> $GITHUB_STEP_SUMMARY
          echo '~~~' >> $GITHUB_STEP_SUMMARY
          grep -E "^error" -A 3 /tmp/rust-build.log | head -60 >> $GITHUB_STEP_SUMMARY || echo "(voir logs complets)" >> $GITHUB_STEP_SUMMARY
          echo '~~~' >> $GITHUB_STEP_SUMMARY
          echo "L'APK est quand même construit avec l'agent intégré Kotlin/Mistral (100% fonctionnel)." >> $GITHUB_STEP_SUMMARY

      - name: Build APK with Gradle
        run: |
          curl -sL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          cd nexadev
          /tmp/gradle-8.7/bin/gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexaDev-APK
          path: nexadev/app/build/outputs/apk/debug/app-debug.apk

      - name: Release APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: nexadev-${{ github.run_number }}
          files: nexadev/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
